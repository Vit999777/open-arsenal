name: Validate research catalog
on:
  push:
    paths: ['data/**', 'config/research.json', 'scripts/**', '.github/workflows/validate.yml']
  pull_request:
    paths: ['data/**', 'config/research.json', 'scripts/**', '.github/workflows/validate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_catalog.py
      - run: python -m unittest discover -s scripts -p 'test_*.py'
